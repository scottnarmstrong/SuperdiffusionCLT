automation:
  methods:
    - method: "agent"
      models:
        - "claude-opus-5.5"
        - "claude-fable-5.1"
        - "claude-opus-5"
        - "claude-sonnet (subagents)"
        - "OpenAI models through Codex"
      framework: "Claude Code (Anthropic) and Codex (OpenAI) agentic coding harnesses; most code by the Claude models"
      tool_setup: >-
        Lake builds under leanprover/lean4:v4.35.0-rc2 with Mathlib v4.35.0-rc2, the public CoarseGraining
        library and the public MarkovProcess library at pinned revisions. The CI workflow builds the library
        with warnings treated as failures and checks the axioms of every stated theorem.
      cost:
        wall_time: "approximately seven weeks of agentic work (August to October 2026)"
        spend_usd: "not separately tracked (subscription accounts)"
        hardware: "a shared 16-CPU / 124 GB RAM Ubuntu machine"
      prompting_notes: >-
        Human-directed agent work, closely supervised by the author; the statements of the main results were
        approved by the author; differences from the paper are disclosed below.
  notes: >-
    All Lean code in this repository was written by the listed models under the close supervision of the
    author. Every proof is checked by the Lean kernel; the library contains no sorry and no custom axiom.

fidelity:
  divergences: >-
    Theorem A specifies the process through its generator: the statement holds for every conservative Feller
    semigroup whose generator acts as the divergence-form operator on twice continuously differentiable functions
    vanishing at infinity, and every continuous-path law with its transition kernels, and an existence clause
    asserts that such a process exists almost surely; the convergence holds for every starting point outside one
    null set. The coefficient field is the recentred field nu Id + (k - k(0)), which defines the same operator. Assumption
    (J1) is stated with the sigma-fields of pointwise restrictions; (J3) is realized by a stored C^2 shell carrier
    (the paper's C^{1,1}_loc); the constants of (J5) are explicit parameters; stationarity is assumed shell by
    shell (equivalent to joint stationarity under (J2)). Further readings of individual printed statements are
    recorded in the docstrings of the statement files under SuperdiffusionCLT/Frozen.

review:
  status: "author-verified"
  reviewers:
    - "Scott Armstrong"
  notes: >-
    Correctness of every proof is checked by the Lean kernel and mathlib (no sorry, no custom axiom). The
    author approved the formal statements of the main results and the disclosed differences from the paper. This
    is not external peer review.

alignment:
  namespace: "SuperdiffusionCLT"
  statements:
