      lean: "SuperdiffusionCLT.Frozen.Section8.theoremA"
      module: "SuperdiffusionCLT.Frozen.Section8.TheoremA"
      status: "proved"
    - source: "Theorem B (quantitative homogenization)"
      lean: "SuperdiffusionCLT.Frozen.Section7.superdiffusivity"
      module: "SuperdiffusionCLT.Frozen.Section7.Superdiffusivity"
      status: "proved"
    - source: "Theorem C (large-scale C^{0,gamma} estimate)"
      lean: "SuperdiffusionCLT.Frozen.Section7.large_scale_holder"
      module: "SuperdiffusionCLT.Frozen.Section7.LargeScaleHolder"
      status: "proved"
    - source: "Theorem D (large-scale C^{1,gamma} estimate)"
      lean: "SuperdiffusionCLT.Frozen.Section6.c1beta"
      module: "SuperdiffusionCLT.Frozen.Section6.C1Beta"
