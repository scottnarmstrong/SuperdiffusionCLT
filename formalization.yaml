version: "v0.4"

project:
  name: "Superdiffusive central limit theorem for a Brownian particle in a critically-correlated incompressible random drift"
  description: >-
    A Lean formalization of the superdiffusive central limit theorem for a Brownian particle in a
    critically-correlated incompressible random drift (Armstrong, Bou-Rabee and Kuusi): the quenched
    superdiffusive invariance principle (Theorem A), quantitative homogenization of the Dirichlet problem
    (Theorem B), the large-scale C^{0,gamma} and C^{1,gamma} regularity theory (Theorems C and D) and the sharp
    asymptotics of the renormalized diffusivities (Theorem 5.1), with every result of Sections 2 to 8 of the paper
    that their proofs use. It is built on the public CoarseGraining homogenization library and the public
    MarkovProcess library.
  authors:
    - "Scott Armstrong"
  responsible_maintainers:
    - "Scott Armstrong"
  license: "Apache-2.0"

classification:
  arxiv: ["math.PR", "math-ph", "math.AP"]
  msc2020: ["60K37", "35B27", "60J60", "60F17"]

sources:
