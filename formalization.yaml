    authors:
      - "Scott Armstrong"
      - "Ahmed Bou-Rabee"
      - "Tuomo Kuusi"
    id: "doi:10.1007/s00222-026-01455-z"
    url: "https://link.springer.com/article/10.1007/s00222-026-01455-z"
    type: "paper"
    relationship: "formalizes"
    note: >-
      Invent. Math., to appear. Corrections found during the formalization are listed in ERRATA.md (whose
      locations refer to the preprint arXiv:2404.01115v3); none of them changes the statements of the main
      theorems.
    license: "all rights reserved"
    author_contacted: "n/a"     # the formalizer is an author of the source
    prior_work: ""
  - title: "Renormalization group and elliptic homogenization in high contrast"
    authors:
      - "Scott Armstrong"
      - "Tuomo Kuusi"
    type: "paper"
    relationship: "background"
    note: >-
      Its Theorem 6.1 is an input of Section 4 of the paper; it is proved here, in corrected form (ERRATA.md,
      items AK1 to AK6), for the cutoff fields of the paper.

