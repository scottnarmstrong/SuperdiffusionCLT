status:
  scope: >-
    Theorems A, B, C, D and Theorem 5.1 of the paper, and every result of Sections 2 to 8 that their proofs
    use, are proved from the paper's assumptions (J1) to (J5) on the law of the random shells. The formal proof
    of Theorem A replaces the parabolic Lemmas 8.2 and 8.3 and the Nash-Aronson estimates of Appendix B by an
    elliptic argument. The log-correlated Gaussian example of Appendix A is not formalized; instead a
    nondegenerate Gaussian shell law is constructed and shown to satisfy all the assumptions, so the theorems
    are not vacuous.
  sorry_count: 0
  sorry_count_scope: "SuperdiffusionCLT library"
  comparator_challenge_sorry_count: 1
  sorry_in_definitions: 0
  axioms:
    - "propext"
    - "Classical.choice"
    - "Quot.sound"
  main_results:
    - declaration: "SuperdiffusionCLT.Frozen.Section8.theoremA"
      file: "SuperdiffusionCLT/Frozen/Section8/TheoremA.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "SuperdiffusionCLTAudit/TheoremA/comparator.json"
      literature_dependencies: []
    - declaration: "SuperdiffusionCLT.Frozen.Section7.superdiffusivity"
      file: "SuperdiffusionCLT/Frozen/Section7/Superdiffusivity.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      literature_dependencies: []
    - declaration: "SuperdiffusionCLT.Frozen.Section7.large_scale_holder"
      file: "SuperdiffusionCLT/Frozen/Section7/LargeScaleHolder.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      literature_dependencies: []
    - declaration: "SuperdiffusionCLT.Frozen.Section6.c1beta"
      file: "SuperdiffusionCLT/Frozen/Section6/C1Beta.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      literature_dependencies: []
    - declaration: "SuperdiffusionCLT.Frozen.Section5.sigmaBar_sharp_bounds"
