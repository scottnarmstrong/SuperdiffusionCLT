name: Palomar preflight

# Runs Palomar's own submission verifier (the reusable workflow of
# PalomarRegistry/PalomarSubmission, mode `full`) on a commit of this
# repository before the Theorem A configuration is submitted to the Palomar
# registry. A passing run's `mechanical-report` artifact has
# `"status": "pass"`. The workflow reference and `pipeline_commit` are the same
# pinned PalomarSubmission commit.

"on":
  workflow_dispatch:
    inputs:
      commit:
        description: Full 40-character commit of this repository to verify
        required: true
        type: string

permissions:
  contents: read

jobs:
  palomar:
    uses: PalomarRegistry/PalomarSubmission/.github/workflows/submission.yml@d4e41c1d5b0d114c4859e6e5831dc6d3ad1d0d44
    with:
      repository: ${{ github.repository }}
      commit: ${{ inputs.commit }}
      pipeline_commit: d4e41c1d5b0d114c4859e6e5831dc6d3ad1d0d44
      # Palomar requires exactly twelve lowercase letters or digits.
      request_id: scltpreflite
      mode: full
      execution_profile: palomar-standard-v1
      options: '{"comparator_config_path":"SuperdiffusionCLTAudit/TheoremA/comparator.json","authorization_relationship":"I am a responsible author or maintainer"}'
